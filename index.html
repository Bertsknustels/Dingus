<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 Een verrassing voor jou!</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff77a9, #7b5cff, #38cfff);
    }

    #start {
      padding: 22px 40px;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      background: white;
      color: #7b3cff;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      transition: transform .2s;
      z-index: 10;
    }

    #start:hover {
      transform: scale(1.08);
    }

    #feest {
      display: none;
      text-align: center;
      color: white;
      z-index: 5;
      animation: binnen 0.7s ease-out;
    }

    #feest h1 {
      font-size: clamp(50px, 10vw, 130px);
      margin: 0;
      text-shadow: 0 5px 20px rgba(0,0,0,.3);
    }

    #feest p {
      font-size: clamp(25px, 4vw, 50px);
    }

    @keyframes binnen {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      70% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 12px;
      height: 22px;
      z-index: 20;
      animation: vallen linear forwards;
    }

    @keyframes vallen {
      from {
        transform: translateY(-10vh) rotate(0deg);
      }
      to {
        transform: translateY(115vh) rotate(900deg);
      }
    }
  </style>
</head>

<body>

<button id="start">🎁 Klik hier voor je verrassing</button>

<div id="feest">
  <h1>🎉 GEFELICITEERD! 🎉</h1>
  <p>🥳🎂 Van harte gefeliciteerd! 🎂🥳</p>
</div>

<audio id="muziek">
  <!-- Zet hier je eigen legaal verkregen happy-birthday-muziekbestand neer -->
  happy-birthday.mp3
</audio>

<script>
  const knop = document.getElementById("start");
  const feest = document.getElementById("feest");
  const muziek = document.getElementById("muziek");

  knop.addEventListener("click", () => {
    knop.style.display = "none";
    feest.style.display = "block";

    muziek.play().catch(() => {});

    // Veel confetti 🎊
    for (let i = 0; i < 250; i++) {
      maakConfetti();
    }

    // Nog een paar seconden door blijven strooien
    const regen = setInterval(() => {
      for (let i = 0; i < 15; i++) {
        maakConfetti();
      }
    }, 250);

    setTimeout(() => clearInterval(regen), 10000);
  });

  function maakConfetti() {
    const stukje = document.createElement("div");
    stukje.className = "confetti";

    const kleuren = [
      "#ff1744",
      "#ffea00",
      "#00e676",
      "#00b0ff",
      "#d500f9",
      "#ff9100"
    ];

    stukje.style.left = Math.random() * 100 + "vw";
    stukje.style.background =
      kleuren[Math.floor(Math.random() * kleuren.length)];

    stukje.style.animationDuration =
      (2 + Math.random() * 4) + "s";

    stukje.style.transform =
      `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(stukje);

    setTimeout(() => {
      stukje.remove();
    }, 6500);
  }
</script>

</body>
</html>
